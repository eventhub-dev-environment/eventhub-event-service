server:
  port: 8083

spring:
  application:
    name: event-service
  profiles:
    active: dev

# Valor por defecto para pruebas locales si no existe la variable de entorno
gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: "b3,w3c"
    export:
      zipkin:
        endpoint: ${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://minio:9000}
    public-url: ${AWS_S3_PUBLIC_URL:http://localhost:9000}
    access-key: ${AWS_S3_ACCESS_KEY:minioadmin}
    secret-key: ${AWS_S3_SECRET_KEY:minioadminpassword}
    bucket-name: ${AWS_S3_BUCKET_NAME:eventhub-branding}
    region: ${AWS_S3_REGION:us-east-1}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"